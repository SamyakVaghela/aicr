[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicr"
version = "0.1.0"
description = "AI code reviewer that runs locally and gates git push."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Praeclarum Engineering" }]
dependencies = [
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aicr = "aicr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
